# =============================================================================
# NeuraRoads ADAS - YOLOv8 training hyperparameters (FROM SCRATCH)
# -----------------------------------------------------------------------------
# Consumed by src/training/train_yolo.py and passed to Ultralytics' trainer.
# Tuned for: NVIDIA GTX 1660 SUPER (6 GB), 20,000-image dataset, 10 classes,
# training WITHOUT any pretrained COCO weights.
#
# 6 GB VRAM note: yolov8m @ 640 needs a modest batch. `batch: -1` lets
# Ultralytics auto-pick ~60% VRAM; set an explicit small number if you hit OOM.
# =============================================================================

# ---- Model / data -----------------------------------------------------------
architecture: "yolov8m"          # from-scratch backbone (matches model_config)
data: "data/annotations/data.yaml"
pretrained: false                # TRAIN FROM SCRATCH (no COCO weights)

# ---- Core schedule ----------------------------------------------------------
epochs: 150                      # from-scratch needs many epochs; early-stops via patience
patience: 30                     # early stopping (epochs without val improvement)
imgsz: 640
batch: -1                        # -1 = auto (~60% VRAM). Use 8 if OOM on 6 GB.
workers: 8                       # dataloader workers (Ryzen 5 5600 = 6c/12t)
seed: 42
deterministic: true

# ---- Optimizer --------------------------------------------------------------
optimizer: "SGD"                 # SGD is robust for from-scratch YOLO training
lr0: 0.01                        # initial LR
lrf: 0.01                        # final LR fraction (cosine)
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
cos_lr: true

# ---- Loss gains -------------------------------------------------------------
box: 7.5
cls: 0.5
dfl: 1.5

# ---- Runtime / memory -------------------------------------------------------
amp: false                       # FP32: GTX 16-series (1660 SUPER) FP16 is buggy -> NaN loss.
                                 # 16-series has no Tensor Cores, so FP16 gives no speedup anyway.
cache: false                     # set "ram"/"disk" if I/O bound and RAM allows
close_mosaic: 10                 # disable mosaic for the last N epochs
save_period: 10                  # checkpoint every N epochs
val: true
plots: true

# ---- Data augmentation (strong, good for from-scratch generalisation) -------
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0                     # dashcam is upright; no rotation
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.1
copy_paste: 0.0

# ---- Output -----------------------------------------------------------------
project: "models/trained"        # runs saved under models/trained/<name>
name: "neuraroads_yolov8m"       # best.pt -> models/trained/neuraroads_yolov8m/weights/best.pt
exist_ok: false                  # set true to overwrite an existing run dir
